[project]
name = "ponente-ingestion"
version = "0.1.0"
description = "Philippine Supreme Court e-Library scraper + OCR + embedder for Ponente."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Ponente" }]
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pdfminer.six>=20240706",
  "pdf2image>=1.17",
  "pytesseract>=0.3.13",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
  "click>=8.1",
  "rich>=13.7",
]

[project.scripts]
ponente-ingest = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
